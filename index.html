<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Who Should We Hire? — Human Intelligence + AI Recruitment Game</title>
<style>
:root{
  --navy:#143a63;--blue:#2276d2;--blue2:#eaf4ff;--green:#169b62;--green2:#e8f8f0;
  --purple:#6d43c5;--purple2:#f1ebff;--orange:#ef8b1e;--orange2:#fff3e4;
  --red:#d94b4b;--red2:#fff0f0;--gold:#d99b00;--gold2:#fff8df;
  --bg:#eef5fa;--card:#fff;--text:#163b62;--muted:#5e7388;--line:#d8e5ef;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#edf5fb,#f7fafc);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{background:linear-gradient(135deg,#143f69,#216b9d);color:#fff;padding:22px 18px}
.wrap{max-width:1180px;margin:auto;padding:16px}
header h1{margin:0;font-size:32px}
header p{margin:7px 0 0;font-size:16px}
.steps{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:8px;
  padding:5px 0 14px;
}
.step{
  width:100%;
  min-width:0;
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#e4edf5;
  border:2px solid transparent;
  border-radius:22px;
  padding:9px 10px;
  font-weight:700;
  font-size:13px;
  color:#46627b;
  cursor:pointer;
  font-family:inherit;
  white-space:normal;
  line-height:1.2;
  transition:transform .15s,background .15s,box-shadow .15s,border-color .15s;
}
.step:hover{
  background:#d6e8f8;
  border-color:#9fc8ea;
  transform:translateY(-1px);
}
.step:active{transform:translateY(0)}
.step.on{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
  box-shadow:0 5px 14px #2276d244;
}
.step.on{background:var(--blue);color:#fff;box-shadow:0 5px 14px #2276d244}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 5px 20px #143a6310;margin-bottom:15px}
.hero{background:linear-gradient(135deg,#eef7ff,#e8fbfa);border:1px solid #cfe4f2;border-radius:20px;padding:26px;margin-bottom:16px}
.hero h2{margin:0 0 10px;font-size:30px}
.hero p{line-height:1.6;margin:6px 0}
h2,h3{margin-top:0}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}
.tile{border:1px solid var(--line);background:#f8fbfd;border-radius:15px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
button,.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--blue);color:white;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.green{background:var(--green)}.dark{background:#294a64}.purple{background:var(--purple)}.orange{background:var(--orange)}.red{background:var(--red)}
input,select{width:100%;padding:12px;border:1px solid #cbd9e5;border-radius:10px;font:inherit;background:#fff;color:var(--text)}
label{font-weight:700;font-size:14px}
.candidate{border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0;background:#fff}
.candidate.selected{border:2px solid var(--green);background:var(--green2)}
.tag{display:inline-block;padding:5px 9px;border-radius:14px;background:#e9f1f7;margin:2px;font-size:12px;font-weight:700}
.status{padding:12px;border-radius:10px;background:#eef4f8;margin:10px 0;line-height:1.5}
.ok{background:var(--green2);color:#17653f}.warn{background:var(--gold2);color:#7c5a00}.err{background:var(--red2);color:#8e2828}
.choice{display:block;width:100%;margin:7px 0;text-align:left;background:#f5f8fa;color:var(--text);border:1px solid #d6e1e9;cursor:pointer;pointer-events:auto;position:relative;z-index:2}
.choice:hover{transform:translateY(-1px);box-shadow:0 3px 10px #00000012}
.choice.selected{background:#e8f3ff;border:2px solid var(--blue)}
.score{font-size:34px;font-weight:800;color:var(--green)}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
th,td{border:1px solid #d6e1e8;padding:9px;text-align:left}
th{background:#edf4f8}
.progress{height:10px;background:#dfe8ee;border-radius:10px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}
.fit-good{background:var(--green2);border-left:6px solid var(--green);padding:16px;border-radius:10px}
.fit-review{background:var(--gold2);border-left:6px solid var(--gold);padding:16px;border-radius:10px}
.fit-low{background:var(--red2);border-left:6px solid var(--red);padding:16px;border-radius:10px}
.theory{cursor:pointer;border:2px solid transparent;transition:.15s}
.theory:hover{border-color:#9bc9f3;transform:translateY(-2px)}
.answerA{background:#eaf9f2!important;border-color:#7ad3aa!important}
.answerB{background:#fff0f0!important;border-color:#f0a1a1!important}
.answerC{background:#fff8df!important;border-color:#ebcb72!important}
.answerD{background:#f1ebff!important;border-color:#b9a1ed!important}
.small{font-size:13px}.center{text-align:center}
.flow{display:flex;gap:8px;align-items:center;overflow:auto;padding:5px 0}
.flow .box{white-space:nowrap;background:#edf5fb;border-radius:12px;padding:12px 15px;font-weight:700}
.flow .arrow{font-size:22px;color:var(--blue)}
.badge{display:inline-block;padding:7px 11px;border-radius:18px;background:#eaf4ff;font-weight:700;color:#1f6db7}
.info{background:#edf7ff;border-left:5px solid var(--blue);padding:14px;border-radius:8px;line-height:1.5}
.sticky{position:sticky;bottom:10px;background:#ffffffee;border:1px solid var(--line);backdrop-filter:blur(8px);padding:12px;border-radius:14px}
@media(max-width:650px){
  .steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .step{min-height:44px;font-size:12px;padding:8px 6px}
 header h1{font-size:25px}.card,.hero{padding:16px}.row{display:block}.row>*{margin-bottom:8px}
 table{font-size:12px}.hero h2{font-size:25px}
}

.pageBackWrap{margin:0 0 12px 0}
.pageBack{background:#294a64;color:#fff;border:0;border-radius:10px;padding:11px 18px;font:700 15px Arial,Helvetica,sans-serif;cursor:pointer;box-shadow:0 3px 8px #143a6320}
.pageBack:hover{background:#1d4059;transform:translateY(-1px)}
.pageBack:active{transform:translateY(0)}
.paginationBtn{min-height:48px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(max-width:600px){.row.pagination{display:flex!important;align-items:center;justify-content:center;gap:8px}.row.pagination>*{flex:0 0 auto}.row.pagination .center{min-width:145px}}
.row button{touch-action:manipulation;min-height:48px}.row button[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}.candidate button{touch-action:manipulation}
</style>
</head>
<body>
<header><div class="wrap"><h1>🎯 Who Should We Hire?</h1><p>Human Intelligence + AI Recruitment Game • Full Public Dataset — 3,000 Records</p></div></header>
<div class="wrap"><div id="steps" class="steps" aria-label="Game stages"></div><div class="small muted" style="margin:-7px 0 10px 4px">💡 Click any stage above to revisit it.</div><main id="app"></main></div>
<script>
"use strict";

const DATA_URL="https://raw.githubusercontent.com/srujanamaruthu/resume-screening-ml/main/dataset/realistic_resume_dataset_3000.csv";
let candidates=[], stage=0, page=1, humanSelected=new Set(), aiResults=[], screenFilters={role:"",education:"",experience:"",skill:"",decision:""}, model={accuracy:0,coefs:[],bias:0,featureNames:[]}, modelTrained=false;
let mbtiAnswers=[], mbtiIndex=0;

const labels=["Recruitment Brief","Human Screening","AI Ranking","HI vs AI Overlap","Use HI as HR","MBTI Questions","Theory & Constructs","ML Dataset","ML Training","Explainability","Fairness","Final Decision"];

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function app(x){const back=stage>0?`<div class="pageBackWrap"><button type="button" class="pageBack" onclick="backOneStage()">← Back</button></div>`:"";document.getElementById("app").innerHTML=back+x}
function steps(){document.getElementById("steps").innerHTML=labels.map((x,i)=>`<button type="button" class="step ${i===stage?'on':''}" onclick="jumpToStage(${i})">${i+1}. ${x}</button>`).join("")}
function go(n){stage=n;steps();window.scrollTo({top:0,behavior:"smooth"})}
function backOneStage(){if(stage>0)jumpToStage(stage-1)}
function jumpToStage(n){
 if(n===0)return welcome();
 if(!candidates.length){alert("The public dataset is still loading. Please wait a moment.");return;}
 if(n===1)return screening();
 if(n===2||n===3){if(humanSelected.size!==10){alert("Please select exactly 10 candidates in Human Screening first.");return;}return aiCompare(n)}
 if(n===4){if(humanSelected.size!==10){alert("Please select exactly 10 candidates first.");return;}return hiGame()}
 if(n===5){if(humanSelected.size!==10){alert("Please select exactly 10 candidates first.");return;}return mbtiStage()}
 if(n===6)return theoryStage();
 if(n===7)return datasetStage();
 if(n===8)return mlTraining();
 if(n===9){if(!modelTrained){alert("Please train the ML model first.");return;}return explainStage()}
 if(n===10){if(!modelTrained){alert("Please train the ML model first.");return;}return fairness()}
 if(n===11)return finalDecision();
}

function parseCSV(text){
 const rows=[];let row=[],cell="",quoted=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i],next=text[i+1];
  if(ch==='"'&&quoted&&next==='"'){cell+='"';i++;continue}
  if(ch==='"'){quoted=!quoted;continue}
  if(ch===','&&!quoted){row.push(cell);cell="";continue}
  if((ch==='\n'||ch==='\r')&&!quoted){
   if(ch==='\r'&&next==='\n')i++;
   row.push(cell);cell="";
   if(row.some(v=>v.trim()!==""))rows.push(row);
   row=[];continue
  }
  cell+=ch
 }
 if(cell!==""||row.length){row.push(cell);rows.push(row)}
 const headers=rows.shift().map(x=>x.trim());
 return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]??"").trim()])));
}

async function loadDataset(){
 const status=document.getElementById("loadStatus");
 try{
  const res=await fetch(DATA_URL,{cache:"no-store"});
  if(!res.ok)throw new Error("Could not download the public recruitment dataset");
  const raw=await res.text(), rows=parseCSV(raw);
  candidates=rows.map((r,i)=>({
   id:r.Resume_ID||String(i+1), name:r.Name||"Candidate", age:Number(r.Age), gender:Number(r.Gender), skills:r.Skills||"", primarySkill:r["Primary Skill"]||"",
   skillMatch:Number(r["Skill Match Score"]), roleMatch:Number(r["Role Match Score"]), experience:Number(r["Experience (Years)"]),
   education:r["Education Level"]||"", cgpa:Number(r.CGPA), certifications:Number(r["Certifications Count"]), projects:Number(r["Project Count"]),
   internships:Number(r["Internship Experience"]), previousTitle:r["Previous Job Title"]||"", role:r["Job Role"]||"", linkedin:Number(r["LinkedIn Score"]),
   yearsGrad:Number(r["Years Since Graduation"]), jobType:r["Job Type"]||"", decision:(r["Final Decision"]||"").toLowerCase()==="hire"
  })).filter(c=>Number.isFinite(c.skillMatch)&&Number.isFinite(c.roleMatch)&&Number.isFinite(c.experience));
  if(candidates.length!==3000)throw new Error(`Expected 3,000 records but loaded ${candidates.length}.`);
  status.className="status ok";
  status.innerHTML=`<b>✓ Full public recruitment dataset loaded.</b> ${candidates.length.toLocaleString()} candidate records.`;
  document.getElementById("startBtn").disabled=false;
 }catch(e){
  status.className="status err";
  status.innerHTML=`<b>Dataset loading error:</b> ${esc(e.message)}<br>Please open the HTML with internet access.`;
 }
}
function welcome(){
 go(0);
 app(`<div class="hero"><span class="badge">🎯 HR Mission</span><h2>Recruitment simulation using a public resume-screening dataset</h2>
 <p>This version keeps the original game's interface and learning flow, while using the <b>complete 3,000-record public recruitment dataset</b> as the candidate source.</p></div>
 <div class="card"><h3>🗂️ Public Recruitment Dataset</h3><div class="grid">
 <div class="tile"><b>Records</b><div class="score">3,000</div><p>Complete public candidate dataset.</p></div>
 <div class="tile"><b>HR fields</b><div class="score">18</div><p>Skills, role, education, experience, scores, projects, certifications and more.</p></div>
 <div class="tile"><b>AI ranking</b><div class="score">6</div><p>Role match, skill match, experience, CGPA, projects and certifications.</p></div>
 <div class="tile"><b>Target</b><div class="score">Hire</div><p>Final Decision: Hire / Reject.</p></div>
 </div><div id="loadStatus" class="status">Loading the complete public recruitment dataset…</div>
 <button id="startBtn" class="green" disabled onclick="screening()">Start Human Screening →</button></div>
 <div class="info"><b>Dataset note:</b> The source describes this as a realistic/synthetic 3,000-candidate resume dataset. The simulation uses the source fields as provided and does not invent missing candidate attributes.</div>`);
 if(candidates.length){
   document.getElementById("loadStatus").className="status ok";
   document.getElementById("loadStatus").innerHTML=`<b>✓ Dataset ready.</b> ${candidates.length.toLocaleString()} records loaded.`;
   document.getElementById("startBtn").disabled=false;
 } else loadDataset();
}
function filteredPool(){
 return candidates.filter(c=>{
  const role=!screenFilters.role||c.role===screenFilters.role;
  const edu=!screenFilters.education||c.education===screenFilters.education;
  const exp=!screenFilters.experience||c.experience>=Number(screenFilters.experience);
  const skill=!screenFilters.skill||c.skillMatch>=Number(screenFilters.skill);
  const dec=!screenFilters.decision||String(c.decision?"Hire":"Reject")===screenFilters.decision;
  return role&&edu&&exp&&skill&&dec;
 });
}
function applyScreenFilters(){screenFilters={role:document.getElementById("filterRole")?.value||"",education:document.getElementById("filterEducation")?.value||"",experience:document.getElementById("filterExperience")?.value||"",skill:document.getElementById("filterSkill")?.value||"",decision:document.getElementById("filterDecision")?.value||""};page=1;renderScreen()}
function resetScreenFilters(){screenFilters={role:"",education:"",experience:"",skill:"",decision:""};page=1;renderScreen()}
function firstScreenPage(){page=1;renderScreen()}
function previousScreenPage(){if(page>1){page--;renderScreen()}}
function nextScreenPage(){const total=Math.max(1,Math.ceil(filteredPool().length/10));if(page<total){page++;renderScreen()}}
function screening(){go(1);renderScreen()}
function renderScreen(){
 const filtered=filteredPool(),totalPages=Math.max(1,Math.ceil(filtered.length/10));if(page>totalPages)page=totalPages;
 const start=(page-1)*10,shown=filtered.slice(start,start+10);
 const roles=[...new Set(candidates.map(c=>c.role))].sort(),edus=[...new Set(candidates.map(c=>c.education))].sort();
 app(`<div class="hero"><span class="badge">👤 Human Intelligence (HI)</span><h2>Stage 2 — Human Screening</h2>
 <p><b>Vacancy pool:</b> Complete public resume-screening dataset</p>
 <p>Review the candidate evidence and select exactly <b>10 candidates</b>. All ${candidates.length.toLocaleString()} public records are available.</p></div>
 <div class="card"><h3>🔎 HR Candidate Filters</h3><p class="muted">These filters use only fields that actually exist in the public recruitment dataset.</p>
 <div class="grid">
 <div><label>Job Role</label><select id="filterRole"><option value="">All roles (${candidates.length})</option>${roles.map(v=>{const n=candidates.filter(c=>c.role===v).length;return `<option value="${esc(v)}" ${screenFilters.role===v?"selected":""}>${esc(v)} (${n})</option>`}).join("")}</select></div>
 <div><label>Education Level</label><select id="filterEducation"><option value="">All education (${candidates.length})</option>${edus.map(v=>{const n=candidates.filter(c=>c.education===v).length;return `<option value="${esc(v)}" ${screenFilters.education===v?"selected":""}>${esc(v)} (${n})</option>`}).join("")}</select></div>
 <div><label>Minimum Experience</label><select id="filterExperience"><option value="">Any experience</option>${[0,3,5,8,10,12].map(v=>{const n=candidates.filter(c=>c.experience>=v).length;return n?`<option value="${v}" ${screenFilters.experience==String(v)?"selected":""}>${v}+ years (${n})</option>`:""}).join("")}</select></div>
 <div><label>Minimum Skill Match</label><select id="filterSkill"><option value="">Any skill match</option>${[50,60,70,80,90].map(v=>{const n=candidates.filter(c=>c.skillMatch>=v).length;return n?`<option value="${v}" ${screenFilters.skill==String(v)?"selected":""}>${v}+ (${n})</option>`:""}).join("")}</select></div>
 <div><label>Final Decision</label><select id="filterDecision"><option value="">All outcomes (${candidates.length})</option><option value="Hire" ${screenFilters.decision==="Hire"?"selected":""}>Hire (${candidates.filter(c=>c.decision).length})</option><option value="Reject" ${screenFilters.decision==="Reject"?"selected":""}>Reject (${candidates.filter(c=>!c.decision).length})</option></select></div>
 </div>
 <div class="row" style="margin-top:12px"><button class="green" onclick="applyScreenFilters()">✓ Apply Filters</button><button class="dark" onclick="resetScreenFilters()">↻ Reset Filters</button></div>
 <div class="info"><b>Filter check:</b> Each individual selectable value shown has records in the full dataset. Combined filters may legitimately produce zero matches.</div>
 <div class="status"><b>Matching candidates:</b> ${filtered.length} of ${candidates.length}</div></div>
 <div class="grid"><div class="tile"><b>Full dataset</b><div class="score">${candidates.length}</div></div><div class="tile"><b>After filters</b><div class="score">${filtered.length}</div></div><div class="tile"><b>Human shortlist</b><div class="score">${humanSelected.size}/10</div></div><div class="tile"><b>Remaining selections</b><div class="score">${10-humanSelected.size}</div></div></div>
 <div class="row pagination"><button class="dark paginationBtn" onclick="firstScreenPage()">First</button><button class="paginationBtn" onclick="previousScreenPage()" ${page<=1?"disabled":""}>← Previous</button><div class="center"><b>Page ${page} of ${totalPages}</b><br><span class="small">${filtered.length?`Showing ${start+1}–${Math.min(start+10,filtered.length)}`:"No matching candidates"}</span></div><button class="paginationBtn" onclick="nextScreenPage()" ${page>=totalPages?"disabled":""}>Next →</button></div>
 <div>${shown.length?shown.map(candidateCard).join(""):`<div class="card center"><h3>No candidates match these filters</h3><p>Reset or broaden the filters and try again.</p></div>`}</div>
 <div class="sticky row"><button class="dark" onclick="welcome()">← Dataset Brief</button><button class="green" ${humanSelected.size===10?"":"disabled"} onclick="aiCompare(2)">Compare my 10 with AI →</button></div>`);
}
function candidateCard(c){
 return `<div class="candidate ${humanSelected.has(c.id)?"selected":""}"><div class="row"><div><b>#${esc(c.id)}</b> <span class="tag">${esc(c.role)}</span></div><div class="small">${esc(c.jobType)}</div></div>
 <p><b>${esc(c.name)}</b></p><p class="small"><b>Education:</b> ${esc(c.education)} • <b>Experience:</b> ${c.experience} yrs • <b>CGPA:</b> ${c.cgpa.toFixed(2)}</p>
 <p class="small"><b>Skill Match:</b> ${c.skillMatch} • <b>Role Match:</b> ${c.roleMatch} • <b>Projects:</b> ${c.projects} • <b>Certifications:</b> ${c.certifications}</p>
 <p class="small"><b>Primary Skill:</b> ${esc(c.primarySkill)} • <b>Previous Role:</b> ${esc(c.previousTitle)}</p>
 <p class="small"><b>Skills:</b> ${esc(c.skills)}</p>
 <button class="${humanSelected.has(c.id)?"green":""}" onclick="toggleHuman('${esc(c.id)}')">${humanSelected.has(c.id)?"✓ Selected by HI":"Select with Human Intelligence"}</button></div>`;
}
function toggleHuman(id){
 if(humanSelected.has(id))humanSelected.delete(id);
 else if(humanSelected.size<10)humanSelected.add(id);
 else{alert("Human shortlist is limited to exactly 10 candidates.");return}
 renderScreen();
}
function aiScore(c){
 return +(0.35*c.roleMatch+0.30*c.skillMatch+0.15*Math.min(100,c.experience/15*100)+0.08*c.cgpa/10*100+0.05*Math.min(100,c.projects/8*100)+0.04*Math.min(100,c.certifications/5*100)+0.03*c.linkedin).toFixed(1);
}
function aiCompare(targetStage=2){
 if(humanSelected.size!==10){alert("Please select exactly 10 candidates first.");return}
 go(targetStage);
 const pool=candidates.map(c=>({...c,aiScore:aiScore(c)})).sort((a,b)=>b.aiScore-a.aiScore);
 aiResults=pool;const aiTop10=pool.slice(0,10),hiIds=new Set(humanSelected);
 const overlap=aiTop10.filter(c=>hiIds.has(c.id)),hiOnly=[...humanSelected].filter(id=>!aiTop10.some(c=>c.id===id)),aiOnly=aiTop10.filter(c=>!hiIds.has(c.id));
 if(targetStage===2){
  app(`<div class="hero"><span class="badge">🤖 AI Ranking</span><h2>Stage 3 — AI Ranks the Complete Candidate Dataset</h2><p>AI independently evaluates all <b>${pool.length.toLocaleString()} public candidates</b>.</p></div>
  <div class="flow"><div class="box">${pool.length} candidates</div><div class="arrow">→</div><div class="box">AI evaluates HR evidence</div><div class="arrow">→</div><div class="box">AI Top 10</div></div>
  <div class="grid"><div class="tile"><b>Total candidates</b><div class="score">${pool.length}</div></div><div class="tile"><b>AI Top 10</b><div class="score">10</div></div><div class="tile"><b>Highest AI score</b><div class="score">${aiTop10[0]?.aiScore??"—"}</div></div><div class="tile"><b>Human shortlist</b><div class="score">10</div></div></div>
  <div class="card"><h3>🏆 AI Top 10</h3><p class="muted">Teaching ranking formula uses role match, skill match, experience, CGPA, projects, certifications and LinkedIn score. It is a transparent classroom heuristic, not a production hiring model.</p><table><tr><th>Rank</th><th>Candidate</th><th>Job Role</th><th>Experience</th><th>Skill Match</th><th>Role Match</th><th>AI Score</th></tr>${aiTop10.map((c,i)=>`<tr><td><b>${i+1}</b></td><td>${esc(c.name)}<br><span class="small">${esc(c.id)}</span></td><td>${esc(c.role)}</td><td>${c.experience} yrs</td><td>${c.skillMatch}</td><td>${c.roleMatch}</td><td><b>${c.aiScore}</b></td></tr>`).join("")}</table></div>
  <div class="card"><h3>🤖 What the AI sees</h3><p>The ranking uses candidate evidence already present in the source dataset. It does not create skills, roles, education or experience that are absent from the record.</p></div>
  <div class="hero"><h2>Next: HI vs AI Overlap</h2><button class="green" onclick="aiCompare(3)">🔄 Go to HI vs AI Overlap →</button></div>`);
 }else{
  app(`<div class="hero"><span class="badge">🔄 HI vs AI Overlap</span><h2>Stage 4 — HI vs AI Overlap</h2><p>This compares your 10 Human Intelligence selections with the AI Top 10 from all ${candidates.length.toLocaleString()} candidates.</p></div>
  <div class="flow"><div class="box">HI selects 10</div><div class="arrow">+</div><div class="box">AI Top 10</div><div class="arrow">→</div><div class="box">Overlap analysis</div></div>
